# ============================================================================
# Docker Swarm - Compose para Produção em Cluster
# ============================================================================
# Este arquivo é otimizado para Docker Swarm e consolida:
# - Redes overlay para comunicação entre nodes
# - Configs nativos do Swarm (distribuição automática de configurações)
# - Secrets nativos do Swarm (gerenciamento seguro de credenciais)
# - Deploy com réplicas, updates e rollbacks
# - Placement constraints para controlar onde serviços rodam
# - Healthchecks e restart policies específicos do Swarm
# - Limites de recursos e logging estruturado
# 
# IMPORTANTE: Este arquivo requer Docker Swarm mode ativado
# 
# BOAS PRÁTICAS IMPLEMENTADAS:
# ✓ Configs para distribuição automática de arquivos de configuração
# ✓ Secrets criptografados para dados sensíveis
# ✓ Redes overlay isoladas (frontend/backend)
# ✓ Healthchecks para detecção de falhas
# ✓ Rolling updates com zero downtime
# ✓ Rollback automático em caso de falha
# ✓ Resource limits para previsibilidade
# ✓ Logging estruturado com rotação
# ✓ Security options (no-new-privileges, cap_drop)
# ============================================================================

# ============================================================================
# CONFIGURAÇÃO DE REDES
# ============================================================================
# Redes overlay permitem comunicação entre containers em diferentes nodes do Swarm
# Criadas automaticamente com criptografia IPsec entre nodes
networks:
  # Rede frontend: exposta ao mundo externo via nginx
  frontend:
    driver: overlay  # Necessário para Swarm - permite comunicação multi-node
    ipam:
      config:
        - subnet: 172.20.0.0/24
    # Labels para documentação
    labels:
      com.docker.compose.network: "frontend"
      description: "Rede pública para nginx e acesso externo"

  # Rede backend: isolada, apenas comunicação interna
  backend:
    driver: overlay  # Necessário para Swarm - permite comunicação multi-node
    ipam:
      config:
        - subnet: 172.21.0.0/24
    # Isolamento total: sem acesso externo, apenas app e banco se comunicam
    internal: true  # Bloqueia acesso externo - containers só se comunicam internamente
    labels:
      com.docker.compose.network: "backend"
      description: "Rede privada isolada para app e banco de dados"

# ============================================================================
# CONFIGURAÇÃO DE VOLUMES
# ============================================================================
volumes:
  # ============================================================================
  # Volume para dados do PostgreSQL
  # ============================================================================
  # IMPORTANTE: Em produção, a escolha do storage é crítica para performance,
  # disponibilidade e backup do banco de dados.
  #
  # OPÇÃO 1: Volume Docker Nativo (ATUAL - Recomendado para single-node)
  # Melhor performance, gerenciado pelo Docker, isolamento adequado
  postgres_data:
    driver: local
    # Docker gerencia automaticamente em /var/lib/docker/volumes/
    # Vantagens:
    # - Melhor performance (otimizado pelo Docker)
    # - Gerenciamento automático de permissões
    # - Integração com backup via plugins
    # - Portabilidade entre ambientes
    labels:
      description: "Dados persistentes do PostgreSQL"
      backup: "daily"
      critical: "true"
  
  # OPÇÃO 2: Bind Mount com caminho absoluto
  # Use quando precisar de controle total do local de armazenamento
  # postgres_data:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     o: bind
  #     device: /var/lib/docker-volumes/postgres  # Caminho ABSOLUTO
  #   # Vantagens:
  #   # - Controle total do local (ex: montar em SSD/NVMe dedicado)
  #   # - Facilita backup automatizado com scripts externos
  #   # - Útil para compliance (auditoria de localização física dos dados)
  #   labels:
  #     description: "Dados persistentes do PostgreSQL"
  
  # OPÇÃO 3: NFS - Network File System (Ideal para clusters/alta disponibilidade)
  # Use em ambientes distribuídos onde múltiplos nodes precisam acessar os dados
  # file_storage:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: addr=192.168.1.100,rw,nfsvers=4.1,hard,intr
  #     device: ":/mnt/nfs/file_storage"
  #   # Vantagens:
  #   # - Compartilhamento entre múltiplos nodes
  #   # - Facilita failover e alta disponibilidade
  #   # - Backup centralizado no storage server
  #   # - Escalabilidade horizontal
  #   # Desvantagens:
  #   # - Latência de rede (impacto na performance)
  #   # - Dependência do NFS server (ponto único de falha)
  #   # - Requer configuração adicional de segurança
  #   labels:
  #     description: "Armazenamento de arquivos via NFS"

  # OPÇÃO 4: Block Storage (AWS EBS, DigitalOcean Volumes, GCP Persistent Disks)
  # Use em ambientes cloud com volumes gerenciados dedicados para alta performance
  # postgres_data:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     o: bind
  #     device: /mnt/block-storage/postgres  # Volume externo montado
  #   # PRÉ-REQUISITO: Montar o volume block storage no host primeiro:
  #   # sudo mkdir -p /mnt/block-storage
  #   # sudo mount /dev/disk/by-id/scsi-0DO_Volume_postgres-vol /mnt/block-storage
  #   # 
  #   # Vantagens:
  #   # - Performance garantida (IOPS dedicados)
  #   # - Snapshots automáticos para backup
  #   # - Expansão dinâmica de tamanho
  #   # - Migração entre instâncias (attach/detach)
  #   # - SLA de disponibilidade do provedor cloud
  #   # Desvantagens:
  #   # - Custos adicionais por GB/IOPS
  #   # - Limitado a uma zona de disponibilidade
  #   # - Requer configuração no provedor cloud
  #   labels:
  #     description: "Dados persistentes do PostgreSQL via Block Storage"

  # Volume para logs da aplicação
  # PRODUÇÃO: Volume gerenciado pelo Docker (mais seguro e portável)
  app_logs:
    driver: local
    labels:
      description: "Logs da aplicação Node.js"

# ============================================================================
# CONFIGS
# ============================================================================
# Configs nativos do Docker Swarm - distribuídos automaticamente para todos os nodes
# Ideal para arquivos de configuração não-sensíveis (nginx.conf, etc)
# 
# IMPORTANTE: Criar configs ANTES de fazer o deploy:
#   docker config create nginx_conf ./nginx/nginx.conf
#   docker config create nginx_default_conf ./nginx/conf.d/default.conf
# 
# Verificar configs criados:
#   docker config ls
#   docker config inspect nginx_conf
#
# TROUBLESHOOTING:
# - Se o serviço não iniciar, verifique se os configs existem (docker config ls)
# - Configs são imutáveis: para atualizar, crie novo config e atualize o serviço
# - Use 'docker service ps <service> --no-trunc' para ver erros relacionados a configs
configs:
  nginx_conf:
    external: true  # Config já existe no Swarm
  nginx_default_conf:
    external: true  # Config já existe no Swarm

# ============================================================================
# SECRETS
# ============================================================================
# Secrets nativos do Docker Swarm - armazenados criptografados e distribuídos
# de forma segura entre os nodes. Montados em /run/secrets/ dentro dos containers.
# 
# IMPORTANTE: Criar secrets ANTES de fazer o deploy:
#   echo "sua_senha_segura" | docker secret create db_password -
#   echo "usuario_db" | docker secret create db_user -
#   echo "jwt_token_secreto" | docker secret create jwt_secret -
# 
# Verificar secrets criados:
#   docker secret ls
#   docker secret inspect db_password
secrets:
  db_password:
    external: true  # Secret já existe no Swarm
  db_user:
    external: true  # Secret já existe no Swarm
  jwt_secret:
    external: true  # Secret já existe no Swarm
  
# ============================================================================
# CONFIGURAÇÕES
# ============================================================================
# Arquivo .env é carregado automaticamente
# Variáveis podem ser substituídas usando ${VARIABLE:-default}

# ============================================================================
# SERVIÇOS
# ============================================================================
services:
  
  # ============================================================================
  # NGINX - Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:alpine
    
    # Redes: conectado ao frontend (externo) e backend (app)
    networks:
      - frontend
      - backend
    
    # Portas expostas
    ports:
      - 80:80
      # - target: 80
      #   published: 80
      #   protocol: tcp
      #   mode: ingress  # Swarm routing mesh - load balance automático entre réplicas
    
    # Configs - Distribuídos automaticamente pelo Swarm para todos os nodes
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
        mode: 0444  # read-only
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0444  # read-only
    
    # Dependências - NOTA: no Swarm, depends_on só controla ordem de início, não garante que esteja pronto
    depends_on:
      - app
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s  # Nginx inicializa muito rápido
    
    # Configuração de deploy no Swarm
    deploy:
      replicas: 3  # 3 instâncias - 1 por node para distribuição uniforme
      
      # Limites e reservas de recursos por réplica
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
      
      # Política de restart do Swarm
      restart_policy:
        condition: on-failure  # Reinicia apenas em caso de falha
        delay: 5s
        max_attempts: 3
        window: 30s  # Se rodar por 30s sem falhar, considera sucesso e reseta contador
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,tier,environment"
        tag: "nginx"
    
    # Labels para organização
    labels:
      service: "nginx"
      tier: "frontend"
      environment: "${ENVIRONMENT:-production}"
    
  # ==========================================================================
  # NODE.JS APPLICATION
  # ==========================================================================
  app:
    image: argentinaluiz/docker-prod-test:latest

    # Redes: backend (db) e frontend (nginx)
    networks:
      - backend
      - frontend
    
    # Variáveis de ambiente
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-appdb}
      # Secrets são carregados via arquivos em /run/secrets/
      - LOG_LEVEL=${LOG_LEVEL:-info}
    
    # Secrets
    secrets:
      - db_password
      - db_user
      - jwt_secret
    
    # Volumes
    volumes:
      - app_logs:/app/logs
    
    # Dependências - NOTA: no Swarm, depends_on só controla ordem de início, não garante healthcheck
    depends_on:
      - postgres
    
    # Healthcheck - verifica se aplicação responde corretamente
    healthcheck:
      test: ["CMD", "node", "/home/node/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5  # Tolerância para 5 falhas consecutivas antes de marcar como unhealthy
      start_period: 15s  # Tempo para app inicializar e conectar ao DB
    
    # Configuração de deploy e orquestração no Swarm
    deploy:
      # Limites e reservas de recursos por réplica
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      
      replicas: 3  # 3 instâncias para balanceamento de carga
      
      # Estratégia de atualização: rolling update sem downtime
      update_config:
        parallelism: 1      # Atualiza 1 réplica por vez
        delay: 10s          # Espera 10s entre atualizações
        order: start-first  # Inicia nova versão antes de parar a antiga (zero downtime)
        failure_action: rollback  # Rollback automático em caso de falha
      
      # Estratégia de rollback em caso de falha no update
      rollback_config:
        parallelism: 1  # Rollback de 1 réplica por vez
        delay: 5s       # Espera 5s entre rollbacks
      
      
      # Política de restart do Swarm
      restart_policy:
        condition: on-failure  # Reinicia apenas se container falhar (exit code != 0)
        delay: 10s             # Aguarda 10s antes de reiniciar
        max_attempts: 15       # Máximo de 15 tentativas de restart
        window: 60s            # Se rodar por 60s sem falhar, considera sucesso e reseta contador
    
    # Logging estruturado
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service,tier,environment"
        tag: "{{.Name}}/{{.ID}}"
    
    # Labels
    labels:
      service: "app"
      tier: "backend"
      environment: "${ENVIRONMENT:-production}"
      version: "${APP_VERSION:-1.0.0}"
    
    # Drop all capabilities (princípio do menor privilégio)
    cap_drop:
      - ALL
    
    # User namespace (melhor prática de segurança)
    # user: "node:node"  # Descomente se a imagem suportar

  # ==========================================================================
  # POSTGRESQL - Banco de Dados
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    
    # Rede isolada backend
    networks:
      - backend
    
    # Portas: NÃO expor externamente em produção
    # ports:
    #   - "5432:5432"  # ❌ Apenas para debug, remover em produção
    
    # Variáveis de ambiente
    environment:
      - POSTGRES_DB=${DB_NAME:-appdb}
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    # Secrets
    secrets:
      - db_password
      - db_user
    
    # Volumes persistentes
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    
    # OTIMIZAÇÃO: Use tmpfs para dados temporários (melhora performance)
    # Sockets e arquivos temporários não precisam de persistência
    tmpfs:
      - /tmp
      - /var/run/postgresql  # Socket Unix em memória para melhor performance
    
    # Healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s  # PostgreSQL leva ~30s para inicializar
    
    # Configuração de deploy no Swarm
    deploy:
      replicas: 1  # Apenas 1 réplica devido ao volume local
      
      # Limites e reservas de recursos
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
      
      # Placement constraint: fixa o PostgreSQL em um node específico
      # IMPORTANTE: Necessário porque o volume é "driver: local"
      # O volume só existe no node específico, então o container precisa sempre rodar lá
      # 
      # Para usar esta constraint, primeiro crie a label no node:
      #   docker node update --label-add database=true <node-name>
      placement:
        constraints:
          - node.labels.database == true  # Só roda em nodes com esta label customizada
      
      # Política de restart do Swarm
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s  # Se rodar por 60s sem falhar, considera sucesso e reseta contador
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        tag: "postgres"
    
    # Labels
    labels:
      service: "postgres"
      tier: "database"
    
    # Shared memory size (importante para PostgreSQL)
    # NOTA: Em Docker Swarm, shm_size não é suportado diretamente
    # Alternativa: usar tmpfs mount ou aumentar via sysctls no host
    # shm_size: 256mb
    
# ============================================================================
# INICIALIZAÇÃO NO SWARM
# ============================================================================
# 
# 1. Inicializar o Swarm (se ainda não estiver ativo):
#   docker swarm init
#
# 2. Criar secrets antes do deploy:
#   echo "senha_segura" | docker secret create db_password -
#   echo "usuario_db" | docker secret create db_user -
#   echo "jwt_token" | docker secret create jwt_secret -
#
# 3. Criar configs antes do deploy:
#   docker config create nginx_conf ./nginx/nginx.conf
#   docker config create nginx_default_conf ./nginx/conf.d/default.conf
#
# 4. Criar label no node para o PostgreSQL:
#   docker node update --label-add database=true <node-name>
#
# 5. Deploy da stack completa:
#   docker stack deploy -c compose.prod.swarm.yaml myapp
#
# 6. Verificar status da stack:
#   docker stack ls
#   docker stack ps myapp
#   docker service ls
#
# 7. (Opcional) Configurar logs centralizados:
#   Para produção, considere usar:
#   - ELK Stack (Elasticsearch, Logstash, Kibana)
#   - Fluentd + Elasticsearch
#   - Loki + Grafana
#   - CloudWatch (AWS), Stackdriver (GCP), etc
#
# ============================================================================

# ============================================================================
# COMANDOS ÚTEIS PARA SWARM
# ============================================================================
#
# === GERENCIAMENTO DE STACK ===
#
# Deploy/atualizar stack:
#   docker stack deploy -c compose.prod.swarm.yaml myapp
#
# Remover stack completa:
#   docker stack rm myapp
#
# Listar stacks:
#   docker stack ls
#
# Ver serviços da stack:
#   docker stack services myapp
#
# Ver tarefas (containers) da stack:
#   docker stack ps myapp
#
# === GERENCIAMENTO DE SERVIÇOS ===
#
# Listar serviços:
#   docker service ls
#
# Inspecionar serviço:
#   docker service inspect myapp_app
#
# Ver logs de um serviço (todas as réplicas):
#   docker service logs -f myapp_app
#   docker service logs --tail=100 myapp_postgres
#
# Escalar serviço manualmente:
#   docker service scale myapp_app=5
#
# Forçar atualização de serviço (re-deploy):
#   docker service update --force myapp_app
#
# Rollback para versão anterior:
#   docker service rollback myapp_app
#
# Ver réplicas de um serviço:
#   docker service ps myapp_app
#
# === GERENCIAMENTO DE NODES ===
#
# Listar nodes do Swarm:
#   docker node ls
#
# Inspecionar node:
#   docker node inspect <node-name>
#
# Adicionar label ao node:
#   docker node update --label-add database=true <node-name>
#
# Remover label do node:
#   docker node update --label-rm database <node-name>
#
# === GERENCIAMENTO DE SECRETS ===
#
# Listar secrets:
#   docker secret ls
#
# Criar secret:
#   echo "valor" | docker secret create nome_secret -
#
# Inspecionar secret (não mostra o valor):
#   docker secret inspect db_password
#
# Remover secret (precisa remover serviços que usam primeiro):
#   docker secret rm db_password
#
# === GERENCIAMENTO DE CONFIGS ===
#
# Listar configs:
#   docker config ls
#
# Criar config a partir de arquivo:
#   docker config create nginx_conf ./nginx/nginx.conf
#
# Inspecionar config (mostra metadados, não o conteúdo):
#   docker config inspect nginx_conf
#
# Ver conteúdo do config (decodifica base64):
#   docker config inspect --pretty nginx_conf
#
# Remover config (precisa remover serviços que usam primeiro):
#   docker config rm nginx_conf
#
# Atualizar config (configs são imutáveis, precisa criar novo e atualizar serviço):
#   docker config create nginx_conf_v2 ./nginx/nginx.conf
#   docker service update --config-rm nginx_conf --config-add source=nginx_conf_v2,target=/etc/nginx/nginx.conf myapp_nginx
#
# === OPERAÇÕES NO BANCO DE DADOS ===
#
# Executar comando em container específico:
#   docker exec -it $(docker ps -q -f name=myapp_postgres) psql -U postgres -d appdb
#
# Backup do banco:
#   docker exec $(docker ps -q -f name=myapp_postgres) pg_dump -U postgres appdb > backup.sql
#
# Restore do banco:
#   docker exec -i $(docker ps -q -f name=myapp_postgres) psql -U postgres appdb < backup.sql
#
# === VOLUMES ===
#
# Listar volumes:
#   docker volume ls
#
# Inspecionar volume:
#   docker volume inspect myapp_postgres_data
#
# Backup do volume (executar no node onde o volume está):
#   docker run --rm -v myapp_postgres_data:/data -v $(pwd):/backup alpine tar czf /backup/postgres_backup.tar.gz -C /data .
#
# === MONITORAMENTO ===
#
# Visualizar recursos usados pelos serviços:
#   docker stats
#
# Ver eventos do Swarm em tempo real:
#   docker events
#
# Ver logs de todas as réplicas de um serviço:
#   docker service logs -f myapp_app
#
# Ver logs de um container específico:
#   docker logs -f <container-id>
#
# === TROUBLESHOOTING ===
#
# Verificar por que réplicas não estão subindo:
#   docker service ps myapp_nginx --no-trunc
#
# Ver detalhes completos de erros:
#   docker inspect <container-id>
#
# Testar conectividade entre serviços:
#   docker exec -it <container-id> ping postgres
#   docker exec -it <container-id> nslookup postgres
#
# Verificar healthcheck de um container:
#   docker inspect --format='{{json .State.Health}}' <container-id> | jq
#
# Forçar redistribuição de réplicas:
#   docker service update --force myapp_app
#
# Ver histórico de updates/rollbacks:
#   docker service inspect --pretty myapp_app
#
# ============================================================================
